<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Blokus</title>

		<link rel="stylesheet" href="css/style.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

		<script src="https://code.jquery.com/jquery-4.0.0.js"></script>
		<script type="module" src="./js/main.js"></script>
	</head>

	<body>
		<div id="bodyContainer">
			<div id="headerContainer">
				<h1>Welcome to BLOKUS, a turn based board game</h1>
			</div>

			<div id="gameContainer">

				<div id="boardContainer">
					<div id="game">
					</div>
				</div>

				<div id="sidePanel">
					<div id="pieceContainer"></div>
				</div>
			</div>

			<div id="gameInfoContainer">
				<div id="playerScoreContainer">

				</div>

				<div id="buttonContainer">
					<button type="button" class="blokus-button blokus-button--nav" id="game-view">Game</button>
					<button type="button" class="blokus-button blokus-button--nav" id="settings-view">Settings</button>
					<button type="button" class="blokus-button blokus-button--nav" id="tileset-view">Tilesets</button>
					<button type="button" class="blokus-button blokus-button--nav" id="reset-button">Reset Board</button>
				</div>

			</div>


			<div id="settingsContainer" style="display:none">
				<h2>Game settings</h2>
				<form id="settings-form">
					<label for="player-count">Players</label>
					<select id="player-count">
						<option value="2">2 players</option>
						<option value="3">3 players</option>
						<option value="4" selected>4 players</option>
					</select>

					<label for="board-size">Board size</label>
					<select id="board-size">
						<option value="14">14 x 14</option>
						<option value="16">16 x 16</option>
						<option value="18">18 x 18</option>
						<option value="20" selected>20 x 20</option>
					</select>

					<label for="use-anchor-cells">Use anchor cells</label>
					<select id="use-anchor-cells">
						<option value="true">True</option>
						<option value="false" selected>False</option>
					</select>

					<button type="button" class="blokus-button blokus-button--settings" id="apply-settings">Apply and restart</button>
				</form>
			</div>

			<div id="tilesetSelectorContainer" style="display:none">
				<h2>Tilesets</h2>
			</div>

			<div id="tilesetOptionsContainer" style="display:none">

			</div>

			<div id="cursor-piece" class="piece"></div>
		</div>
	</body>

</html>
