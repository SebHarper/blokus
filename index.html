<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Blokus</title>

		<link rel="stylesheet" href="css/style.css">

		<script src="https://code.jquery.com/jquery-4.0.0.js"></script>
		<script type="module" src="./js/main.js"></script>
	</head>

	<body>
		<div id="bodyContainer">
			<div id="headerContainer">
				<h1>Welcome to BLOKUS, a turn based board game</h1>
			</div>

			<div id="gameContainer">

				<div id="boardContainer">
					<div id="game">
					</div>
				</div>

				<div id="sidePanel">
					<div id="pieceContainer"></div>
				</div>
			</div>

			<div id="gameInfoContainer">
				<div id="playerScoreContainer">

				</div>

				<div id="buttonContainer">
					<div class="blokus-button hoverable" id="game-view">Game</div>
					<div class="blokus-button hoverable" id="settings-view">Settings</div>
					<div class="blokus-button hoverable" id="tileset-view">Tileset</div>
					<div class="blokus-button hoverable" id="reset-button">Reset Board</div>
				</div>

			</div>


			<div id="settingsContainer" style="display:none">
				<h2>Game settings</h2>
				<form id="settings-form">
					<label for="player-count">Players</label>
					<select id="player-count">
						<option value="2">2 players</option>
						<option value="3">3 players</option>
						<option value="4" selected>4 players</option>
					</select>

					<label for="board-size">Board size</label>
					<select id="board-size">
						<option value="14">14 x 14</option>
						<option value="16">16 x 16</option>
						<option value="18">18 x 18</option>
						<option value="20" selected>20 x 20</option>
					</select>

					<label for="piece-tray-layout">Piece tray layout</label>
					<select id="piece-tray-layout">
						<option value="classic" selected>Classic arrangement</option>
					</select>

					<button type="button" class="blokus-button hoverable" id="apply-settings">Apply and restart</button>
				</form>
			</div>


			<div id="tilesetOptionsContainer" style="display:none">

			</div>

			<div id="cursor-piece" class="piece"></div>
		</div>
	</body>

</html>
